# Equivalent NeoForge de common/src/main/resources/ultrabeasts.accesswidener
#
# L'access widener elargit le jar a la COMPILATION pour les deux loaders, mais
# seul Fabric l'applique au RUNTIME. NeoForge a besoin de ce fichier, sinon on
# obtient un IllegalAccessError des le premier appel.
#
# Syntaxe : <visibilite> <classe> <methode><descripteur>
# Les noms de classes utilisent des points, les classes internes un $,
# et les descripteurs des slashs.

public net.minecraft.world.entity.Display setTransformation(Lcom/mojang/math/Transformation;)V
public net.minecraft.world.entity.Display setTransformationInterpolationDuration(I)V
public net.minecraft.world.entity.Display setTransformationInterpolationDelay(I)V
public net.minecraft.world.entity.Display$BlockDisplay setBlockState(Lnet/minecraft/world/level/block/state/BlockState;)V
